<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện Nói Tiếng Trung Qua Video Ngắn</title>
  
  <!-- ================================================================ -->
  <!-- 👇 4 DÒNG FIREBASE SDK BẮT BUỘC 👇 -->
  <!-- ================================================================ -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <!-- ================================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/pinyin-pro.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f8fafc; min-height: 100vh; padding: 20px; background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0%, transparent 50%), radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 50%); background-attachment: fixed; }
    :root {
      --bg-body: #090d16; --bg-card: rgba(21, 30, 52, 0.7); --bg-input: #10192e; --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b;
      --primary: #6366f1; --primary-hover: #4f46e5; --primary-glow: rgba(99, 102, 241, 0.4);
      --success: #10b981; --success-hover: #059669; --danger: #f43f5e; --danger-hover: #e11d48;
      --warning: #f59e0b; --warning-hover: #d97706; --accent: #a855f7; --accent-hover: #9333ea;
      --border: rgba(255, 255, 255, 0.08); --border-focus: rgba(99, 102, 241, 0.5); --shadow: rgba(0, 0, 0, 0.4); --glass-blur: blur(16px);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    }
    .app-container { max-width: 1400px; margin: 0 auto; display: block; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--bg-card); border: 1px solid var(--border); backdrop-filter: var(--glass-blur); padding: 12px 20px; border-radius: var(--radius-md); box-shadow: 0 4px 20px var(--shadow); flex-wrap: wrap; gap: 10px; }
    .top-bar-left, .top-bar-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .theme-switch-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .theme-switch-btn:hover { border-color: var(--primary); transform: rotate(15deg); }
    .user-status-display { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .user-status-display.admin { color: var(--danger); border-color: var(--danger); background: rgba(244, 63, 94, 0.1); }
    header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; gap: 8px; }
    header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; }
    .main-layout { display: grid; grid-template-columns: 0px 2.2fr 0.8fr; gap: 24px; align-items: start; transition: grid-template-columns 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } }
    .main-layout:not(.library-collapsed) { grid-template-columns: 300px 2.2fr 0.8fr; }
    .library-section { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1; visibility: visible; }
    .main-layout.library-collapsed .library-section { width: 0; min-width: 0; max-width: 0; padding: 0; margin: 0; border: none; box-shadow: none; opacity: 0; visibility: hidden; pointer-events: none; }
    .dashboard-card { background: var(--bg-card); border: 1px solid var(--border); backdrop-filter: var(--glass-blur); border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 10px 30px var(--shadow); display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 160px); overflow-y: auto; }
    .dashboard-card h2 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 4px; }
    .library-tabs { display: flex; gap: 4px; margin-bottom: 2px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .lib-tab { flex: 1; padding: 6px 0; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: 0.2s; text-align: center; }
    .lib-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .lib-tab:hover:not(.active) { color: var(--text-secondary); }
    .library-list { display: flex; flex-direction: column; gap: 10px; max-height: 580px; overflow-y: auto; padding-right: 4px; padding-bottom: 60px; }
    .library-item { padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; transition: 0.25s; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .library-item.pending-item { border-left: 4px solid var(--warning); opacity: 0.7; }
    .library-item.favorite-item { border-left: 4px solid var(--danger); }
    .library-item:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }
    .library-item.active { background: linear-gradient(135deg, var(--primary), rgba(99, 102, 241, 0.25)); border-color: var(--primary); box-shadow: 0 4px 16px var(--primary-glow); }
    .library-item .video-title-span { font-weight: 600; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; display: flex; align-items: center; gap: 4px; }
    .library-item .video-title-span .fav-icon { color: var(--danger); font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .library-item .video-title-span .fav-icon:hover { transform: scale(1.2); }
    .library-item .video-title-span .status-badge { font-size: 0.6rem; padding: 2px 6px; background: var(--warning); color: #000; border-radius: 4px; font-weight: 700; margin-left: auto; }
    .action-buttons { display: flex; gap: 4px; margin-top: 2px; justify-content: flex-end; }
    .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; padding: 4px; border-radius: 4px; transition: 0.2s; }
    .action-btn:hover { background: var(--border); }
    .action-btn.approve-btn { color: var(--success); }
    .action-btn.approve-btn:hover { background: rgba(16, 185, 129, 0.2); }
    .action-btn.delete-btn { color: var(--danger); }
    .action-btn.delete-btn:hover { background: rgba(244, 63, 94, 0.2); }
    .action-btn.edit-btn { color: var(--primary); }
    .action-btn.edit-btn:hover { background: rgba(99, 102, 241, 0.2); }
    .video-player-container { position: relative; width: 100%; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid var(--border); background: #000; height: 65vh; min-height: 420px; max-height: 700px; }
    .video-player-container video { width: 100%; height: 100%; display: block; object-fit: contain; }
    .custom-video-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 70%, rgba(0, 0, 0, 0) 100%); display: flex; flex-wrap: wrap; align-items: center; padding: 10px 12px 6px 12px; gap: 8px; opacity: 0; transition: opacity 0.3s; z-index: 10; }
    .video-player-container:hover .custom-video-controls, .video-player-container:focus-within .custom-video-controls { opacity: 1; }
    .ctrl-btn { background: transparent; border: none; color: #fff; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: 0.2s; }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .timeline-container { flex: 1; display: flex; align-items: center; }
    .timeline-slider { width: 100%; -webkit-appearance: none; appearance: none; background: rgba(255, 255, 255, 0.3); height: 5px; border-radius: 3px; outline: none; cursor: pointer; }
    .timeline-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 8px var(--primary); }
    .time-display { color: #e2e8f0; font-size: 0.75rem; font-weight: 600; font-family: monospace; }
    .speed-selector-wrapper { display: flex; align-items: center; }
    .speed-selector { background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; outline: none; cursor: pointer; }
    .volume-slider-wrapper { display: flex; align-items: center; gap: 4px; margin-left: 4px; }
    .volume-slider-wrapper input[type="range"] { width: 50px; height: 4px; -webkit-appearance: none; background: rgba(255, 255, 255, 0.3); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider-wrapper input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); cursor: pointer; }
    .volume-slider-wrapper .volume-icon { font-size: 0.9rem; color: rgba(255, 255, 255, 0.8); }
    .ctrl-btn-toggle { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .ctrl-btn-toggle.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
    .visualizer-container { background: #0b0f19; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 10px; min-height: 60px; display: flex; flex-direction: column; }
    .visualizer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .visualizer-status { font-size: 0.7rem; color: var(--text-secondary); font-weight: 600; }
    .waveform-scroll-wrapper { overflow-x: auto; overflow-y: hidden; width: 100%; cursor: grab; }
    .waveform-scroll-wrapper:active { cursor: grabbing; }
    .waveform-scroll-wrapper canvas { display: block; width: 100%; height: 40px; min-width: 1000px; }
    .global-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
    .recording-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .dubbing-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .record-timer { font-family: monospace; font-size: 1rem; font-weight: 700; color: var(--danger); min-width: 50px; }
    .record-timer.recording { animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .btn-pause-record { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
    .btn-pause-record.paused { border-color: var(--warning); color: var(--warning); }
    .btn-stop-dubbing { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
    .btn-stop-dubbing:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    #floatingLog { position: fixed; bottom: 20px; right: 20px; width: 420px; max-height: 320px; background: rgba(0, 0, 0, 0.88); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; font-family: monospace; font-size: 0.75rem; color: #0f0; z-index: 9999; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); display: block; flex-direction: column; }
    #floatingLog .log-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 4px; margin-bottom: 6px; flex-shrink: 0; }
    #floatingLog .log-header span { font-size: 0.8rem; color: #aaa; font-weight: 600; }
    #floatingLog .log-toggle-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem; padding: 0 4px; }
    #floatingLog .log-toggle-btn:hover { color: #fff; }
    #floatingLog .log-body { overflow-y: auto; flex: 1; }
    #floatingLog .log-entry { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 2px 0; word-break: break-all; }
    #floatingLog .log-entry .time { color: #888; margin-right: 8px; }
    #floatingLog .log-entry.error { color: #f43f5e; }
    #floatingLog .log-entry.success { color: #10b981; }
    #floatingLog .log-entry.warning { color: #f59e0b; }
    #floatingLog .log-entry.info { color: #60a5fa; }
    #floatingLog.collapsed .log-body { display: none; }
    #floatingLog.collapsed { max-height: 40px; overflow: hidden; }
    .btn { padding: 8px 14px; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 0 14px var(--primary-glow); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); box-shadow: 0 0 14px rgba(244, 63, 94, 0.3); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: var(--success-hover); box-shadow: 0 0 14px rgba(16, 185, 129, 0.3); }
    .btn-secondary { background: var(--bg-input); border-color: var(--border); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn:disabled { background: var(--bg-input) !important; color: var(--text-muted) !important; border-color: var(--border) !important; cursor: not-allowed; }
    .sentence-list-wrapper { position: relative; overflow: hidden; border-radius: var(--radius-md); flex: 1; }
    .focus-window-overlay { position: absolute; top: 35%; left: -2px; right: -2px; height: 120px; transform: translateY(-50%); pointer-events: none; z-index: 10; border-left: 4px solid rgba(99, 102, 241, 0.15); border-right: 4px solid rgba(99, 102, 241, 0.15); }
    .sentence-list { display: flex; flex-direction: column; gap: 12px; max-height: 580px; overflow-y: auto; padding: 130px 4px 300px 4px; scroll-behavior: smooth; }
    .sentence-card { background: var(--bg-input); border: 1px solid var(--border); border-left: 6px solid var(--text-muted); border-radius: var(--radius-md); padding: 14px 16px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 6px; opacity: 0.55; filter: grayscale(25%); }
    .sentence-card.active { opacity: 1 !important; filter: none !important; background: linear-gradient(135deg, var(--primary), rgba(99, 102, 241, 0.3)) !important; border-left: 8px solid var(--primary) !important; transform: scale(1.02) translateX(4px); box-shadow: 0 10px 30px var(--primary-glow); }
    .sub-chinese { font-family: 'Noto Sans SC', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-primary); line-height: 1.4; }
    .sub-pinyin { font-size: 0.9rem; font-weight: 500; color: var(--warning); }
    .sub-vietnamese { font-size: 0.85rem; color: var(--text-secondary); }
    .controls-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; width: 100%; }
    .controls-group .btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; border-radius: 6px; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(2, 6, 23, 0.7); backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s; }
    .modal.show { display: block; opacity: 1; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); margin: 40px auto; padding: 24px; border-radius: var(--radius-lg); width: 90%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
    .close-modal { float: right; font-size: 24px; font-weight: 700; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .close-modal:hover { color: var(--danger); }
    .modal h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 16px; flex-shrink: 0; }
    .modal-body-scroll { flex: 1; overflow-y: auto; padding-right: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-secondary); }
    .form-group input[type="text"], .form-group input[type="file"] { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; }
    .subtitle-row { background: var(--bg-input); padding: 12px 40px 12px 12px; border-radius: var(--radius-md); margin-bottom: 12px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; gap: 8px; }
    .btn-remove-row { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
    .btn-remove-row:hover { color: var(--danger); }
    .time-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .time-inputs input[type="number"] { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 10px; border-radius: var(--radius-sm); outline: none; font-size: 0.85rem; width: 100%; }
    .subtitle-row input[type="text"] { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 12px; border-radius: var(--radius-sm); outline: none; font-size: 0.9rem; width: 100%; }
    .inline-error { color: var(--danger); font-size: 0.8rem; margin-top: 4px; display: none; }
    .inline-error.visible { display: block; }
    .modal-video-preview { background: #000; border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 16/9; max-height: 180px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); position: relative; margin-bottom: 12px; }
    .modal-video-preview video { width: 100%; height: 100%; object-fit: contain; }
    .modal-video-preview .placeholder { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); text-align: center; padding: 20px; gap: 8px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <!-- ===== FLOATING LOG ===== -->
  <div id="floatingLog">
    <div class="log-header">
      <span>📋 Log Hệ Thống</span>
      <button class="log-toggle-btn" id="logToggleBtn" title="Thu nhỏ / Mở rộng">➖</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>

  <!-- ===== APP CONTAINER ===== -->
  <div class="app-container">
    <div class="top-bar">
      <div class="top-bar-left">
        <span style="font-size:1.5rem;">🇨🇳</span>
        <div class="user-status-display" id="userStatusDisplay">👤 Đang tải User...</div>
        <button id="btnToggleLibrary" class="btn btn-secondary" style="padding:6px 12px; font-size:0.85rem;">📚 Hiện Thư Viện</button>
      </div>
      <div class="top-bar-right">
        <button id="themeToggle" class="theme-switch-btn" title="Chuyển đổi Giao diện">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <button id="btnOpenUploadModal" class="btn btn-primary">➕ Tải Video Mới</button>
      </div>
    </div>

    <header>
      <div class="header-title-wrap"><h1>Short Video Shadowing</h1></div>
      <p id="headerSubtitle">Hệ thống luyện nói & lồng tiếng tiếng Trung trên nền tảng Video ngắn</p>
    </header>

    <main class="main-layout library-collapsed" id="mainLayout">
      <aside class="library-section dashboard-card">
        <div class="library-tabs">
            <button class="lib-tab active" data-tab="public">📦 Kho Video</button>
            <button class="lib-tab" data-tab="my">❤️ Thư viện của tôi</button>
            <button class="lib-tab" data-tab="pending" id="pendingTab" style="display:none;">📝 Chờ duyệt</button>
        </div>
        <div id="videoLibraryList" class="library-list"></div>
      </aside>

      <section class="video-section dashboard-card">
        <h2 id="currentVideoTitle">Chọn một video để học</h2>
        <div class="video-player-container">
          <video id="mainVideo" crossorigin="anonymous"></video>
          <div class="custom-video-controls" id="customVideoControls">
            <button id="btnPlayPause" class="ctrl-btn" title="Phát / Tạm dừng">▶</button>
            <div class="timeline-container"><input type="range" id="videoTimeline" min="0" max="100" value="0" step="0.1" class="timeline-slider" /></div>
            <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
            <div class="speed-selector-wrapper">
              <select id="videoSpeed" class="speed-selector" title="Tốc độ phát">
                <option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1.0" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
              </select>
            </div>
            <div class="volume-slider-wrapper">
              <span class="volume-icon">🔊</span>
              <input type="range" id="videoVolumeSlider" min="0" max="100" value="100" title="Âm lượng video">
            </div>
          </div>
        </div>
      </section>

      <section class="practice-section dashboard-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
          <h2 style="margin:0; border:none; padding:0;" id="practiceTitle">💬 Câu Thoại Chi Tiết</h2>
        </div>
        <div class="sentence-list-wrapper" id="sentenceListWrapper">
          <div class="focus-window-overlay"></div>
          <div id="sentenceList" class="sentence-list"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== MODALS ===== -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modalTitle">Tải Video Mới & Tạo Phụ Đề</h2>
      <form id="uploadForm" style="margin-top:0; display:flex; flex-direction:column; flex:1; overflow:hidden;">
        <input type="hidden" id="editVideoId" value="" />
        <div class="modal-body-scroll">
          <div class="modal-video-preview">
            <video id="modalPreviewVideo" style="width:100%; height:100%; object-fit:contain;" controls></video>
            <div class="placeholder" id="modalVideoPlaceholder"><span>📹</span><span>Chọn tệp video để xem trước</span></div>
          </div>
          <div class="form-group"><label>Tên bài học / Video:</label><input type="text" id="inputVideoTitle" placeholder="Ví dụ: Luyện chào hỏi hàng ngày" /></div>
          <div class="form-group"><label>Chọn File Video (MP4):</label><input type="file" id="inputVideoFile" accept="video/mp4,video/*" /></div>
          <hr style="border:0; border-top:1px solid var(--border); margin:8px 0;" />
          <div class="form-group" style="padding:8px 12px; background:rgba(56,189,248,0.05); border:1px dashed rgba(56,189,248,0.2); border-radius:var(--radius-md);">
            <label style="font-size:0.8rem;">📁 Nhập nhanh câu thoại bằng File phụ đề (.txt, .csv, .srt):</label>
            <input type="file" id="inputSubtitleFile" accept=".txt,.csv,.srt" style="margin-top:4px; font-size:0.8rem;" />
          </div>
          <div><h3 style="font-size:1rem; font-weight:700; margin:0 0 8px 0;">Danh Sách Câu Thoại</h3></div>
          <div id="subtitleInputsContainer" style="max-height:260px; overflow-y:auto; padding-right:5px; margin-bottom:8px;"></div>
          <div style="display:flex; gap:10px; margin-bottom:12px;">
            <button type="button" id="btnAddSubtitleRow" class="btn btn-secondary" style="flex:1; padding:8px;">➕ Thêm Câu Thủ Công</button>
            <button type="button" id="btnClearSubtitles" class="btn btn-secondary" style="background:rgba(244,63,94,0.1); border-color:rgba(244,63,94,0.2); color:var(--danger); flex:1; padding:8px;">🗑️ Xóa Hết Câu</button>
          </div>
          <div id="formError" class="inline-error"></div>
          <button type="submit" id="btnSubmitForm" class="btn btn-success" style="width:100%; padding:12px; font-size:1rem;">💾 Lưu Vào Thư Viện</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== SCRIPT XỬ LÝ CHÍNH ===== -->
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDHnUhPNokBrXgYLNqlW0kB9tJm3U0Un0I",
      authDomain: "hocvienngon.firebaseapp.com",
      projectId: "hocvienngon",
      storageBucket: "hocvienngon.firebasestorage.app",
      messagingSenderId: "410660952284",
      appId: "1:410660952284:web:ee5b5a98d12bef3d45bc19"
    };

    const logContainer = document.getElementById('floatingLog');
    const logBody = document.getElementById('logBody');
    const logToggleBtn = document.getElementById('logToggleBtn');

    function addLog(message, type = 'info') {
      if (!logBody) return;
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const time = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class="time">${time}</span>${message}`;
      logBody.appendChild(entry);
      logBody.scrollTop = logBody.scrollHeight;
      if (logBody.children.length > 150) logBody.removeChild(logBody.children[0]);
      console.log(`[${time}] ${message}`);
    }

    let logCollapsed = false;
    logToggleBtn.addEventListener('click', function() {
      logCollapsed = !logCollapsed;
      logContainer.classList.toggle('collapsed', logCollapsed);
      this.textContent = logCollapsed ? '➕' : '➖';
    });

    let firebaseInstance = null;
    if (typeof window.firebase !== 'undefined') {
        firebaseInstance = window.firebase;
        addLog("✅ Đã phát hiện Firebase SDK từ CDN.", 'success');
    } else {
        addLog("❌ Lỗi: Không tìm thấy thư viện Firebase.", 'error');
    }

    if (firebaseInstance && !firebaseInstance.apps.length) {
        try {
            firebaseInstance.initializeApp(FIREBASE_CONFIG);
            addLog("✅ Đã khởi tạo Firebase thành công.", 'success');
        } catch (initError) {
            addLog("⚠️ Lỗi khởi tạo Firebase: " + initError.message, 'error');
        }
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function sanitizeHTML(str) { if (!str) return ''; const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return str.replace(/[&<>"']/g, m => map[m]); }

    function parseCSVorTXT(text) {
      const normalized = text.replace(/\r\n/g, '\n');
      const lines = normalized.split('\n');
      const sentences = [];
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        const parts = trimmed.includes('|') ? trimmed.split('|') : trimmed.split(',');
        if (parts.length >= 3) {
          sentences.push({
            startTime: parseFloat(parts[0].trim()) || 0,
            endTime: parseFloat(parts[1].trim()) || 0,
            hanzi: parts[2]?.trim() || '',
            pinyin: parts[3]?.trim() || '',
            vietnamese: parts[4]?.trim() || ''
          });
        }
      }
      return sentences;
    }

    function parseSRT(data) {
      const normalized = data.replace(/\r\n/g, '\n');
      const pattern = /(\d+)\n(\d{2}:\d{2}:\d{2},\d{3}) --> (\d{2}:\d{2}:\d{2},\d{3})\n([\s\S]*?)(?=\n\n|\n*$)/g;
      const sentences = [];

      function timeToSeconds(str) {
        const parts = str.split(':');
        const secParts = parts[2].split(',');
        return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(secParts[0]) + parseInt(secParts[1]) / 1000;
      }
      let match;
      while ((match = pattern.exec(normalized)) !== null) {
        const start = timeToSeconds(match[2]);
        const end = timeToSeconds(match[3]);
        const textLines = match[4].split('\n').map(l => l.trim()).filter(l => l);
        sentences.push({
          startTime: parseFloat(start.toFixed(1)),
          endTime: parseFloat(end.toFixed(1)),
          hanzi: textLines[0] || '',
          pinyin: textLines[1] || '',
          vietnamese: textLines[2] || ''
        });
      }
      return sentences;
    }

    const FS_COLLECTION_VIDEOS = "videos";
    const FS_COLLECTION_LIBRARIES = "user_libraries";

    async function getAllVideos() {
      try {
        const snap = await firebaseInstance.firestore().collection(FS_COLLECTION_VIDEOS).get();
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        return list;
      } catch (e) {
        addLog("❌ Lỗi lấy danh sách video: " + e.message, 'error');
        return [];
      }
    }

    async function getVideo(id) {
      try {
        const doc = await firebaseInstance.firestore().collection(FS_COLLECTION_VIDEOS).doc(id).get();
        if (doc.exists) return { id: doc.id, ...doc.data() };
        return null;
      } catch (e) {
        addLog("❌ Lỗi lấy video: " + e.message, 'error');
        return null;
      }
    }

    async function addVideo(videoData) {
      try {
        const docRef = firebaseInstance.firestore().collection(FS_COLLECTION_VIDEOS).doc();
        await docRef.set({ ...videoData, id: docRef.id, created_at: Date.now() });
        return docRef.id;
      } catch (e) {
        addLog("❌ Lỗi thêm video: " + e.message, 'error');
        return null;
      }
    }

    async function updateVideo(videoData) {
      try {
        const { id, ...data } = videoData;
        await firebaseInstance.firestore().collection(FS_COLLECTION_VIDEOS).doc(id).update(data);
        return true;
      } catch (e) {
        addLog("❌ Lỗi cập nhật video: " + e.message, 'error');
        return false;
      }
    }

    async function deleteVideo(id) {
      try {
        const videoDoc = await getVideo(id);
        await firebaseInstance.firestore().collection(FS_COLLECTION_VIDEOS).doc(id).delete();
        if (videoDoc && videoDoc.storageUrl) {
          const ref = firebaseInstance.storage().refFromURL(videoDoc.storageUrl);
          try { await ref.delete(); } catch(err) {}
        }
        return true;
      } catch (e) {
        addLog("❌ Lỗi xóa video: " + e.message, 'error');
        return false;
      }
    }

    async function getFavorites(userId) {
      try {
        const snap = await firebaseInstance.firestore().collection(FS_COLLECTION_LIBRARIES).where('userId', '==', userId).get();
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        return list;
      } catch (e) {
        return [];
      }
    }

    async function toggleFavorite(userId, videoId) {
      try {
        const existingSnap = await firebaseInstance.firestore().collection(FS_COLLECTION_LIBRARIES).where('userId', '==', userId).where('videoId', '==', videoId).get();
        if (!existingSnap.empty) {
          await firebaseInstance.firestore().collection(FS_COLLECTION_LIBRARIES).doc(existingSnap.docs[0].id).delete();
          return false;
        } else {
          await firebaseInstance.firestore().collection(FS_COLLECTION_LIBRARIES).add({ userId, videoId, added_at: Date.now() });
          return true;
        }
      } catch (e) {
        return false;
      }
    }

    let currentVideoData = null;
    let CURRENT_USER_ID = null;
    let isAdminMode = false;
    let currentLibraryTab = 'public';
    
    const video = document.getElementById('mainVideo');
    const sentenceListContainer = document.getElementById('sentenceList');
    const videoLibraryList = document.getElementById('videoLibraryList');
    const pendingTab = document.getElementById('pendingTab');
    const userStatusDisplay = document.getElementById('userStatusDisplay');
    const mainLayout = document.getElementById('mainLayout');
    const uploadModal = document.getElementById('uploadModal');
    const uploadForm = document.getElementById('uploadForm');
    const formError = document.getElementById('formError');
    const subtitleInputsContainer = document.getElementById('subtitleInputsContainer');

    function setupCustomVideoPlayer() {
        const btnPlayPause = document.getElementById('btnPlayPause');
        const timeline = document.getElementById('videoTimeline');
        const timeDisplay = document.getElementById('timeDisplay');
        const speedSelect = document.getElementById('videoSpeed');
        const volumeSlider = document.getElementById('videoVolumeSlider');

        if (!btnPlayPause || !video) return;

        btnPlayPause.addEventListener('click', () => {
            if (video.paused) video.play().catch(e => {});
            else video.pause();
        });

        video.addEventListener('play', () => { btnPlayPause.innerText = '⏸'; });
        video.addEventListener('pause', () => { btnPlayPause.innerText = '▶'; });

        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            timeline.value = (video.currentTime / video.duration) * 100;
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        timeline.addEventListener('input', () => {
            if (video.duration) video.currentTime = (timeline.value / 100) * video.duration;
        });

        speedSelect.addEventListener('change', () => { video.playbackRate = parseFloat(speedSelect.value); });
        volumeSlider.addEventListener('input', () => { video.volume = parseFloat(volumeSlider.value) / 100; });
    }

    let sentenceTimingInterval = null;
    function playSentence(id) {
        if (!currentVideoData || !video) return;
        const sentence = currentVideoData.sentences.find(s => s.id === id);
        if (!sentence) return;

        if (sentenceTimingInterval) clearInterval(sentenceTimingInterval);
        video.currentTime = sentence.startTime;
        video.play().catch(e => {});

        sentenceTimingInterval = setInterval(() => {
            if (!video.paused && video.currentTime >= sentence.endTime) {
                video.pause();
                clearInterval(sentenceTimingInterval);
                sentenceTimingInterval = null;
            }
        }, 100);
    }

    function renderSentences() {
        if (!sentenceListContainer) return;
        if (!currentVideoData || !currentVideoData.sentences) {
            sentenceListContainer.innerHTML = '<p style="color:var(--text-muted);padding:20px;text-align:center;">Chưa có câu thoại.</p>';
            return;
        }

        const fragment = document.createDocumentFragment();
        for (const sentence of currentVideoData.sentences) {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.innerHTML = `
                <div class="sub-chinese">${sanitizeHTML(sentence.hanzi)}</div>
                <div class="sub-pinyin">${sanitizeHTML(sentence.pinyin || '')}</div>
                <div class="sub-vietnamese">${sanitizeHTML(sentence.vietnamese || '')}</div>
                <div class="controls-group">
                    <button class="btn btn-primary btn-play-sen" title="Nghe Mẫu">🔊</button>
                </div>
            `;
            card.querySelector('.btn-play-sen').addEventListener('click', () => playSentence(sentence.id));
            fragment.appendChild(card);
        }
        sentenceListContainer.innerHTML = '';
        sentenceListContainer.appendChild(fragment);
    }

    async function renderLibraryList() {
        if (!videoLibraryList) return;
        videoLibraryList.innerHTML = '';
        try {
            const allVideos = await getAllVideos();
            let displayVideos = [];
            let favorites = [];

            if (currentLibraryTab === 'public') {
                displayVideos = allVideos.filter(v => v.scope === 'public' && v.status === 'approved');
            } else if (currentLibraryTab === 'my') {
                favorites = await getFavorites(CURRENT_USER_ID);
                const favIds = favorites.map(f => f.videoId);
                displayVideos = allVideos.filter(v => favIds.includes(v.id) || v.uploadedBy === CURRENT_USER_ID);
            } else if (currentLibraryTab === 'pending' && isAdminMode) {
                displayVideos = allVideos.filter(v => v.status === 'pending');
            }

            if (displayVideos.length === 0) {
                videoLibraryList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem; padding:10px;">Không có video nào.</p>';
                return;
            }

            for (const item of displayVideos) {
                const div = document.createElement('div');
                const isActive = currentVideoData && currentVideoData.id === item.id;
                const isFav = favorites.some(f => f.videoId === item.id);
                div.className = `library-item ${isActive ? 'active' : ''}`;

                let actionsHtml = '';
                if (currentLibraryTab === 'public') {
                    let adminBtns = isAdminMode ? `<button class="action-btn edit-btn" data-vid="${item.id}">✏️</button><button class="action-btn delete-btn" data-vid="${item.id}">🗑️</button>` : '';
                    actionsHtml = `<div class="action-buttons">${adminBtns}<span class="fav-icon" data-vid="${item.id}">${isFav ? '❤️' : '🤍'}</span></div>`;
                } else if (currentLibraryTab === 'pending') {
                    actionsHtml = `<div class="action-buttons"><button class="action-btn approve-btn" data-vid="${item.id}">✅ Duyệt</button><button class="action-btn delete-btn" data-vid="${item.id}">❌ Từ chối</button></div>`;
                } else {
                    actionsHtml = `<div class="action-buttons"><button class="action-btn delete-btn" data-vid="${item.id}">🗑️</button></div>`;
                }

                div.innerHTML = `
                  <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span class="video-title-span">📹 ${sanitizeHTML(item.title)}</span>
                  </div>
                  ${actionsHtml}
                `;

                div.querySelector('.video-title-span').addEventListener('click', () => {
                    currentVideoData = item;
                    if (document.getElementById('currentVideoTitle')) document.getElementById('currentVideoTitle').innerText = item.title;
                    if (video && item.storageUrl) { video.src = item.storageUrl; video.load(); renderSentences(); }
                });

                const favEl = div.querySelector('.fav-icon');
                if (favEl) {
                    favEl.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await toggleFavorite(CURRENT_USER_ID, item.id);
                        renderLibraryList();
                    });
                }

                const delBtn = div.querySelector('.delete-btn');
                if (delBtn) {
                    delBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm("Xóa video này?")) { await deleteVideo(item.id); renderLibraryList(); }
                    });
                }

                const apprBtn = div.querySelector('.approve-btn');
                if (apprBtn) {
                    apprBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        item.status = 'approved';
                        item.scope = 'public';
                        await updateVideo(item);
                        renderLibraryList();
                    });
                }

                videoLibraryList.appendChild(div);
            }
        } catch (err) { addLog("❌ Lỗi hiển thị thư viện: " + err.message, 'error'); }
    }

    function addSubtitleRow(data = {}) {
        const div = document.createElement("div");
        div.className = "subtitle-row";
        div.innerHTML = `
          <button type="button" class="btn-remove-row">❌</button>
          <div class="time-inputs">
             <input type="number" step="0.1" placeholder="Bắt đầu" class="sub-start" value="${data.startTime ?? ''}">
             <input type="number" step="0.1" placeholder="Kết thúc" class="sub-end" value="${data.endTime ?? ''}">
          </div>
          <input type="text" placeholder="Chữ Hán" class="sub-hanzi" value="${sanitizeHTML(data.hanzi ?? '')}">
          <input type="text" placeholder="Pinyin" class="sub-pinyin" value="${sanitizeHTML(data.pinyin ?? '')}">
          <input type="text" placeholder="Dịch nghĩa" class="sub-viet" value="${sanitizeHTML(data.vietnamese ?? '')}">
        `;
        div.querySelector('.btn-remove-row').addEventListener('click', () => div.remove());
        subtitleInputsContainer.appendChild(div);
    }

    function setupEventListeners() {
        document.getElementById('btnOpenUploadModal')?.addEventListener('click', () => uploadModal.classList.add('show'));
        document.querySelector('.close-modal')?.addEventListener('click', () => uploadModal.classList.remove('show'));
        document.getElementById('btnAddSubtitleRow')?.addEventListener('click', () => addSubtitleRow());
        document.getElementById('btnClearSubtitles')?.addEventListener('click', () => { subtitleInputsContainer.innerHTML = ''; });

        document.querySelectorAll('.lib-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentLibraryTab = this.dataset.tab;
                renderLibraryList();
            });
        });

        document.getElementById('btnToggleLibrary')?.addEventListener('click', () => {
            const collapsed = mainLayout.classList.toggle('library-collapsed');
            document.getElementById('btnToggleLibrary').innerText = collapsed ? "📚 Hiện Thư Viện" : "📂 Ẩn Thư Viện";
        });

        uploadForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById("inputVideoTitle").value.trim();
            const videoFile = document.getElementById("inputVideoFile").files[0];
            if (!title || !videoFile) {
                formError.innerText = "⚠️ Vui lòng nhập tiêu đề và chọn file video!";
                formError.classList.add('visible');
                return;
            }
            
            const rows = document.querySelectorAll(".subtitle-row");
            const sentences = [];
            rows.forEach((row, idx) => {
                sentences.push({
                    id: idx + 1,
                    startTime: parseFloat(row.querySelector(".sub-start").value) || 0,
                    endTime: parseFloat(row.querySelector(".sub-end").value) || 0,
                    hanzi: row.querySelector(".sub-hanzi").value.trim(),
                    pinyin: row.querySelector(".sub-pinyin").value.trim(),
                    vietnamese: row.querySelector(".sub-viet").value.trim()
                });
            });

            try {
                addLog("⏳ Đang tải video lên Storage...", 'info');
                const storageRef = firebaseInstance.storage().ref(`videos/${Date.now()}_${videoFile.name}`);
                const snapshot = await storageRef.put(videoFile);
                const storageUrl = await snapshot.ref.getDownloadURL();

                await addVideo({
                    title,
                    storageUrl,
                    sentences,
                    status: isAdminMode ? 'approved' : 'pending',
                    scope: isAdminMode ? 'public' : 'private',
                    uploadedBy: CURRENT_USER_ID
                });

                addLog("✅ Lưu video thành công!", 'success');
                uploadModal.classList.remove("show");
                uploadForm.reset();
                subtitleInputsContainer.innerHTML = '';
                renderLibraryList();
            } catch (err) {
                addLog("❌ Lỗi upload: " + err.message, 'error');
            }
        });
    }

    function initApp() {
        firebaseInstance.auth().onAuthStateChanged(async (user) => {
            if (user) {
                CURRENT_USER_ID = user.uid;
                localStorage.setItem('app_current_user', CURRENT_USER_ID);
            } else {
                CURRENT_USER_ID = localStorage.getItem('app_current_user') || 'guest_user';
            }
            
            // Giả lập quyền Admin kiểm tra từ Firestore hoặc local
            isAdminMode = true; // Chỉnh lại theo hệ thống của bạn nếu cần phân quyền chặt chẽ
            if (isAdminMode && pendingTab) pendingTab.style.display = 'block';
            userStatusDisplay.innerHTML = `👤 ${CURRENT_USER_ID.substring(0, 6)}...`;

            setupCustomVideoPlayer();
            setupEventListeners();
            renderLibraryList();
        });
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
